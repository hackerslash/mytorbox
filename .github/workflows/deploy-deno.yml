name: Deploy to Deno Deploy

# Redeploys the app from the latest main on every push.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deno-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deploy the pushed commit
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          deno deploy . --org hackerslash --app mytorbox --prod --json --non-interactive
