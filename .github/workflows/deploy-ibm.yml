name: Deploy to IBM Code Engine

# Rebuilds the Code Engine app from the latest main on every push.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ce-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install IBM Cloud CLI + plugins
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud --version
          ibmcloud plugin install code-engine -f
          ibmcloud plugin install container-registry -f

      - name: Log in to IBM Cloud
        env:
          IBM_CLOUD_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
        run: |
          ibmcloud login --apikey "$IBM_CLOUD_API_KEY" -r us-east -g Default
          ibmcloud ce project select --name mytorbox

      - name: Build and deploy the pushed commit
        run: |
          ibmcloud ce app update --name mytorbox \
            --build-source https://github.com/hackerslash/mytorbox \
            --build-strategy buildpacks \
            --build-commit "$GITHUB_SHA"

      - name: Report status
        run: ibmcloud ce app get --name mytorbox

      - name: Purge old registry images
        run: |
          ibmcloud cr region-set us-south
          ibmcloud cr image-prune-untagged --restrict mytorboxicr -f
          ibmcloud cr retention-run --images 2 -f mytorboxicr
